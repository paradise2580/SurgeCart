
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surgecart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build: ./backend/core-api
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/surgecart
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-change-in-production-min-256-bits-long
      CORS_ORIGIN: http://localhost:4200
      # Dev only: effectively disables the auth rate limiter so demos and
      # local testing aren't blocked. Production default is 5 per 15 min.
      SURGECART_RATE_LIMIT_AUTH_PER_15MIN: "1000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reserve-gateway:
    build: ./backend/reserve-gateway
    ports: ["8081:8081"]
    environment:
      REDIS_URL: redis://redis:6379
      RESERVATION_TTL_SECONDS: "90"
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [core-api]

volumes:
  pgdata: {}
  redisdata: {}
