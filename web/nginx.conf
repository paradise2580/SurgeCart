server {
    listen 80;
    root /usr/share/nginx/html/browser;
    index index.html;

    # Angular client-side routing: unknown paths fall through to index.html
    # rather than 404ing (mirrors the Vercel rewrite in vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
