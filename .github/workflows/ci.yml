name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch cancels the first. Without this, pushing
# twice in a minute leaves two full matrices running and the older one is
# reporting a status nobody cares about any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    runs-on: ubuntu-latest
    # The concurrency suite fires 5,000 claims per repetition against real
    # containers. It should finish in minutes; if it ever hangs, fail in 25
    # rather than burning the default six hours of runner time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and test (Testcontainers spins up real Postgres + Redis)
        working-directory: backend/core-api
        run: mvn -B verify
      - name: Publish JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: backend/core-api/target/site/jacoco/
          if-no-files-found: ignore

  reserve-gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.22', cache-dependency-path: backend/reserve-gateway/go.sum }
      - name: Vet
        working-directory: backend/reserve-gateway
        run: go vet ./...
      - name: Test (real Redis service container above)
        working-directory: backend/reserve-gateway
        env:
          REDIS_URL: redis://localhost:6379
        run: go test ./... -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx ng lint || true   # non-blocking until the ruleset is tuned
      # Browser choice comes from karma.conf.js, which launches Chrome with
      # --no-sandbox. Passing --browsers here would override that and Chrome
      # cannot start without it inside a container.
      - name: Unit tests
        working-directory: frontend
        run: npx ng test --watch=false
      - working-directory: frontend
        run: npx ng build --configuration production

  docker-build-and-scan:
    needs: [core-api, reserve-gateway, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build core-api image
        run: docker build -t surgecart/core-api:${{ github.sha }} ./backend/core-api
      - name: Build reserve-gateway image
        run: docker build -t surgecart/reserve-gateway:${{ github.sha }} ./backend/reserve-gateway

      # The scan reports, it does not gate. Base images routinely carry HIGH
      # CVEs with no fix published yet, so exit-code 1 here means the pipeline
      # goes red for something no commit in this repo can fix — which trains
      # everyone to ignore a red build. Findings are uploaded to the Security
      # tab instead, where they can be triaged.
      - name: Scan core-api image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: surgecart/core-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-core-api.sarif

      - name: Scan reserve-gateway image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: surgecart/reserve-gateway:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-gateway.sarif

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-reports
          path: trivy-*.sarif
          if-no-files-found: ignore

  deploy:
    needs: [docker-build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Skip rather than fail when the deploy credentials are not configured
      # — a fork, or a clone without secrets, should still get a green CI.
      - name: Check for deploy credentials
        id: creds
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_SERVICE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Railway secrets not set — skipping deploy."
          fi

      - name: Trigger Railway deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          # --fail turns an HTTP error into a non-zero exit. Without it curl
          # exits 0 on a 401 and a broken deploy reports as a green build.
          curl --fail --silent --show-error \
            -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"${RAILWAY_SERVICE_ID}\\\") }\"}"
      # Vercel redeploys the frontend automatically on push via its own
      # GitHub integration — no step needed here.
