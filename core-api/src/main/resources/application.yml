spring:
  application:
    name: surgecart-core-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/surgecart}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

surgecart:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production-min-256-bits-long-please}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  reservation:
    ttl-seconds: 90
  rate-limit:
    # Auth attempts per 15 min per IP. 5 is the production value; raise it
    # for local dev/demos via SURGECART_RATE_LIMIT_AUTH_PER_15MIN.
    auth-per-15min: ${SURGECART_RATE_LIMIT_AUTH_PER_15MIN:5}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      paymentProvider:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5

logging:
  level:
    com.surgecart: INFO
    org.springframework.security: WARN
